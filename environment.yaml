# Conda environment for the full jwst123 / hst123 repository.
#
# Create and activate:
#   conda env create -f environment.yaml
#   conda activate jwst123
#
# Why not `pip install -r requirements.txt`?
# - requirements.txt pins packages from the Python 3.10 era (numpy 1.24, astropy 5.3.3).
# - On Python 3.12, pip builds astropy 5.3.3 from source and fails because setuptools
#   removed the deprecated `setuptools.dep_util` module.
# - The JWST scripts (jwst123.py, mosaic.py) additionally need jwst, jhat, shapely,
#   photutils, etc., which are not listed in requirements.txt and require Python 3.10–3.12
#   with newer astropy/numpy/scipy than those pins allow.
#
# This file uses Python 3.11 and installs STScI packages via pip on top of conda-forge
# binary libraries (notably HDF5/blosc for drizzlepac's pytables dependency).

name: jwst123
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip

  # drizzlepac -> pytables needs these system libraries on macOS
  - hdf5
  - blosc
  - pytables

  # Core scientific stack (versions compatible with jwst>=1.17 and drizzlepac)
  - numpy>=1.25,<2
  - scipy>=1.14
  - matplotlib
  - pandas
  - shapely
  - scikit-image
  - tqdm

  # HST/JWST shared dependencies available as conda binaries
  - astroquery
  - astroscrappy
  - requests

  # Installed via pip because they are not on conda-forge and/or need STScI releases
  - pip:
      - jwst>=1.17,<2
      - jhat
      - drizzlepac
      - stwcs
      - progressbar33
      - ccdproc
      - stpsf
      - reproject
      - photutils
