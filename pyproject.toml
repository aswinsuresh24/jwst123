[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jwst123"
version = "0.1.0"
description = "JWST download, custom-JHAT alignment, mosaicking, and DOLPHOT helpers."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Charlie Kilpatrick" },
    { name = "Aswin Suresh" },
]
keywords = [
    "astronomy",
    "jwst",
    "nircam",
    "miri",
    "mast",
    "photometry",
    "dolphot",
    "jhat",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
]
# Runtime dependencies are loaded from requirements.txt (pinned).
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
    "ipython",
    "jupyter",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/charliekilpatrick/jwst-nircam"
Repository = "https://github.com/charliekilpatrick/jwst-nircam"

# Console entry points live under jwst123.scripts (library code stays in jwst123.*).
[project.scripts]
download = "jwst123.scripts.download:main"
jwst-download = "jwst123.scripts.download:main_jwst_download"
align = "jwst123.scripts.align:main"
mosaic = "jwst123.scripts.mosaic:main"
link-raw = "jwst123.scripts.link_raw:main"
image-overlap = "jwst123.scripts.image_overlap:main"
region = "jwst123.scripts.region:main"
illuminated-s-region = "jwst123.scripts.region:main"
relative-align = "jwst123.scripts.relative_align:main"
alignment-wrap = "jwst123.scripts.alignment_wrap:main"
apply-gwcs = "jwst123.scripts.apply_gwcs:main"
catalog = "jwst123.scripts.catalog:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["jwst123*"]
exclude = ["jwst123.notebooks*"]

[tool.setuptools.package-data]
jwst123 = [
    "notebooks/*.ipynb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
